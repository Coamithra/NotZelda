<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Legends of Amara</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d1117;
    color: #c9d1d9;
    font-family: "Fira Mono", "Cascadia Code", "Consolas", monospace;
    font-size: 15px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* ---------- Login / Title screen ---------- */
  #login-screen {
    position: fixed; inset: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #login-screen.hidden { display: none; }

  #title-canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    max-width: 100vw;
    max-height: 100vh;
  }

  .login-card {
    position: absolute;
    background: #0d0d1a;
    border: 2px solid #c89e1c;
    border-radius: 2px;
    padding: 1.8rem 2rem;
    width: 340px;
    max-width: 85vw;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.5s ease, transform 0.5s ease;
    pointer-events: none;
  }
  .login-card.hidden { display: none; }
  .login-card.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .login-card h1 { color: #e6b422; font-size: 1.4rem; margin-bottom: .2rem; text-align: center; }
  .login-card p.subtitle { color: #7a7e88; font-size: .8rem; margin-bottom: 1.4rem; text-align: center; }
  .login-card label { display: block; color: #8b949e; font-size: .8rem; margin-bottom: .3rem; }
  .login-card input {
    width: 100%; padding: .5rem .7rem; margin-bottom: 1rem;
    background: #08081a; border: 1px solid #30363d; border-radius: 2px;
    color: #c9d1d9; font-family: inherit; font-size: .95rem;
  }
  .login-card input:focus { outline: none; border-color: #e6b422; }
  .login-card button {
    width: 100%; padding: .6rem; background: #e6b422; color: #0d1117;
    border: none; border-radius: 2px; font-family: inherit;
    font-size: 1rem; font-weight: 700; cursor: pointer;
  }
  .login-card button:hover { background: #d4a31c; }
  #login-error { color: #f85149; font-size: .85rem; margin-bottom: .8rem; min-height: 1.2em; }

  /* ---------- Game screen ---------- */
  #game-screen { display: none; flex-direction: row; align-items: flex-start; justify-content: center; gap: 0; }
  #game-screen.active { display: flex; }

  #game-col { display: flex; flex-direction: column; align-items: center; }

  canvas {
    border: 2px solid #30363d;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  /* ---------- Server log panel ---------- */
  #server-log {
    display: none;
    width: 340px;
    height: 530px;
    background: #0d1117;
    border: 2px solid #30363d;
    border-left: none;
    overflow-y: auto;
    padding: 6px 8px;
    font-family: "Fira Mono", "Cascadia Code", "Consolas", monospace;
    font-size: 11px;
    line-height: 1.4;
    color: #8b949e;
    scrollbar-width: thin;
    scrollbar-color: #30363d #0d1117;
  }
  #server-log.active { display: block; }
  #server-log .log-line { white-space: pre-wrap; word-break: break-all; }
  #server-log .log-line.highlight { color: #e6b422; }
  #server-log .log-line.error { color: #f85149; }
  #server-log .log-line.regen { color: #3fb950; }
  #server-log .log-line.deprecation { color: #d2a8ff; }

  /* ---------- Chat log ---------- */
  #chat-log {
    width: 720px;
    height: 120px;
    background: #0d1117;
    border: 2px solid #30363d;
    border-top: none;
    overflow-y: auto;
    padding: 4px 8px;
    font-size: .8rem;
    color: #8b949e;
    scrollbar-width: thin;
    scrollbar-color: #30363d #0d1117;
  }
  #chat-log .chat-line { margin: 2px 0; line-height: 1.3; }
  #chat-log .chat-name { color: #e6b422; font-weight: bold; }
  #chat-log .chat-npc { color: #d2a8ff; }
  #chat-log .chat-system { color: #484f58; font-style: italic; }
  #chat-log .chat-item { color: #f0c040; font-style: italic; }
  #chat-log .chat-boss { color: #f0c040; font-weight: bold; font-style: italic; }

  /* ---------- Chat bar ---------- */
  #chat-bar {
    display: flex;
    width: 720px;
    background: #161b22;
    border: 2px solid #30363d;
    border-top: none;
  }
  #chat-bar.focused { border-color: #e6b422; }
  #chat-input {
    flex: 1; padding: .5rem .7rem;
    background: transparent; border: none;
    color: #c9d1d9; font-family: inherit; font-size: .9rem;
    outline: none;
  }
  #chat-input::placeholder { color: #484f58; }
  #chat-hint {
    padding: .5rem .7rem;
    color: #484f58; font-size: .8rem;
    align-self: center;
  }

  /* ---------- Mobile D-pad ---------- */
  #dpad {
    display: none;
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 150px;
    height: 150px;
    z-index: 20;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .dpad-btn {
    position: absolute;
    width: 50px;
    height: 50px;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: rgba(255,255,255,0.7);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .dpad-btn:active, .dpad-btn.active {
    background: rgba(230,180,34,0.4);
    border-color: #e6b422;
  }
  .dpad-up    { top: 0;   left: 50px; }
  .dpad-down  { bottom: 0; left: 50px; }
  .dpad-left  { top: 50px; left: 0; }
  .dpad-right { top: 50px; right: 0; }

  /* ---------- Mobile action buttons ---------- */
  #mobile-chat-btn, #mobile-sword-btn {
    display: none;
    position: fixed;
    width: 50px;
    height: 50px;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    font-size: 22px;
    color: rgba(255,255,255,0.7);
    z-index: 20;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
  }
  #mobile-chat-btn { bottom: 70px; right: 20px; }
  #mobile-sword-btn { bottom: 130px; right: 20px; }
  #mobile-sword-btn:active, #mobile-sword-btn.active {
    background: rgba(230,180,34,0.4);
    border-color: #e6b422;
  }

  #debug-btn {
    position: fixed;
    bottom: 8px;
    right: 8px;
    width: 28px;
    height: 28px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 50%;
    font-size: 14px;
    color: rgba(255,255,255,0.3);
    z-index: 20;
    cursor: pointer;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  /* ---------- Mobile overrides ---------- */
  body.mobile #chat-log { display: none; }
  body.mobile #dpad { display: block; }
  body.mobile #mobile-chat-btn, body.mobile #mobile-sword-btn { display: flex; align-items: center; justify-content: center; }
  body.mobile #debug-btn { bottom: 20px; right: 20px; width: 36px; height: 36px; font-size: 18px; }
  body.mobile #chat-bar { display: none; }
  body.mobile #chat-bar.focused {
    display: flex;
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    z-index: 30;
    border: 2px solid #e6b422;
  }
</style>
</head>
<body>

<!-- Login / Title Screen -->
<div id="login-screen">
  <canvas id="title-canvas" width="720" height="528"></canvas>
  <div class="login-card hidden" id="login-card">
    <h1>Legends of Amara</h1>
    <p class="subtitle">Enter the world</p>
    <div id="login-error"></div>
    <label for="name-input">Your name</label>
    <input id="name-input" type="text" maxlength="20" placeholder="e.g. Aldric">
    <label for="desc-input">Short description</label>
    <input id="desc-input" type="text" maxlength="80" placeholder="e.g. A wandering bard with a lute">
    <button id="connect-btn">Connect</button>
  </div>
</div>

<!-- Game -->
<div id="game-screen">
  <div id="game-col">
    <canvas id="game" width="720" height="528"></canvas>
    <div id="chat-log"></div>
    <div id="chat-bar">
      <input id="chat-input" type="text" placeholder="Press Enter to chat..." autocomplete="off">
      <span id="chat-hint">ESC to close</span>
    </div>
  </div>
  <div id="server-log"></div>
</div>

<!-- Mobile controls -->
<div id="dpad">
  <div class="dpad-btn dpad-up" data-dir="up">&#9650;</div>
  <div class="dpad-btn dpad-down" data-dir="down">&#9660;</div>
  <div class="dpad-btn dpad-left" data-dir="left">&#9664;</div>
  <div class="dpad-btn dpad-right" data-dir="right">&#9654;</div>
</div>
<button id="mobile-sword-btn">&#9876;</button>
<button id="mobile-chat-btn">&#128172;</button>
<button id="debug-btn">&pi;</button>

<!-- Game scripts — load order matters -->
<script src="game_state.js?v=3"></script>
<script src="title.js?v=1"></script>
<script src="tiles.js?v=3"></script>
<script src="sprite_data.js?v=3"></script>
<script src="sprites.js?v=3"></script>
<script src="music.js?v=9"></script>
<script src="renderer.js?v=2"></script>
<script src="fx.js?v=1"></script>
<script src="net.js?v=7"></script>
<script>
// ---------------------------------------------------------------------------
// Init — bind DOM refs and start game loop
// ---------------------------------------------------------------------------

// Mobile detection
G.ui.isMobile = /Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)
  || (navigator.maxTouchPoints > 1 && window.innerWidth < 1024);

if (G.ui.isMobile) {
  document.body.classList.add("mobile");
}

function scaleForMobile() {
  if (!G.ui.isMobile) return;
  const gameCanvas = document.getElementById("game");
  const vw = window.innerWidth;
  const vh = window.innerHeight - 180;
  const scaleX = vw / CW;
  const scaleY = vh / CH;
  const s = Math.min(scaleX, scaleY);
  gameCanvas.style.width = (CW * s) + "px";
  gameCanvas.style.height = (CH * s) + "px";
}

if (G.ui.isMobile) {
  window.addEventListener("resize", scaleForMobile);
  scaleForMobile();
}

// Bind DOM refs
G.ui.loginScreen = document.getElementById("login-screen");
G.ui.gameScreen  = document.getElementById("game-screen");
G.ui.loginError  = document.getElementById("login-error");
G.ui.nameInput   = document.getElementById("name-input");
G.ui.descInput   = document.getElementById("desc-input");
G.ui.connectBtn  = document.getElementById("connect-btn");
G.ui.canvas      = document.getElementById("game");
G.ui.ctx         = G.ui.canvas.getContext("2d");
G.ui.chatInput   = document.getElementById("chat-input");
G.ui.chatBar     = document.getElementById("chat-bar");
G.ui.chatHint    = document.getElementById("chat-hint");
G.ui.chatLog     = document.getElementById("chat-log");
G.ui.serverLog   = document.getElementById("server-log");

// ---------------------------------------------------------------------------
// Title screen
// ---------------------------------------------------------------------------
TITLE.init();

// Title screen input — Enter/click/tap transitions to login form
document.getElementById("title-canvas").addEventListener("click", function () {
  if (TITLE.phase === "title") TITLE.showLogin();
});
document.addEventListener("keydown", function titleKey(e) {
  if (TITLE.phase === "title" && (e.key === "Enter" || e.key === " ")) {
    e.preventDefault();
    TITLE.showLogin();
  }
});

// ---------------------------------------------------------------------------
// Game loop
// ---------------------------------------------------------------------------
// ---------------------------------------------------------------------------
// Movement helpers — half-tile free movement
// ---------------------------------------------------------------------------
const DIR_DX = { up: 0, down: 0, left: -1, right: 1 };
const DIR_DY = { up: -1, down: 1, left: 0, right: 0 };

function getActiveDirection() {
  return G.player.dirStack.length > 0 ? G.player.dirStack[G.player.dirStack.length - 1] : null;
}

function setState(newState, data) {
  G.player.state = newState;
  G.player.stateData = data || {};
}

function sendToServer(msg) {
  if (G.conn.ws && G.conn.ws.readyState === WebSocket.OPEN) {
    if (G.conn.networkLog && (msg.type === "player_state" || msg.type === "attack")) {
      const t = performance.now().toFixed(1);
      console.log(`[NET OUT t=${t}] ${msg.type} ${msg.direction||""} x=${msg.x} y=${msg.y} [${G.player.state}]`);
    }
    G.conn.ws.send(JSON.stringify(msg));
  }
}

function simulateMove(x, y, dir, dt) {
  /** Pure movement simulation — must exactly match server logic.
      Returns {x, y} after applying speed, axis snapping, and collision. */
  const isHorizontal = (dir === "left" || dir === "right");
  const speed = MOVE_SPEED * dt;
  let newX = x + DIR_DX[dir] * speed;
  let newY = y + DIR_DY[dir] * speed;

  // Half-tile axis snapping on perpendicular axis
  if (isHorizontal) {
    const targetY = Math.round(y * 2) / 2;
    if (Math.abs(y - targetY) > 0.01) {
      const alignDelta = Math.sign(targetY - y) * Math.min(speed, Math.abs(y - targetY));
      newY = y + alignDelta;
    }
  } else {
    const targetX = Math.round(x * 2) / 2;
    if (Math.abs(x - targetX) > 0.01) {
      const alignDelta = Math.sign(targetX - x) * Math.min(speed, Math.abs(x - targetX));
      newX = x + alignDelta;
    }
  }

  // Collision with fallback
  const checkX = isHorizontal ? newX : Math.round(x * 2) / 2;
  const checkY = isHorizontal ? Math.round(y * 2) / 2 : newY;

  if (canMoveToPosition(checkX, checkY)) {
    return { x: newX, y: newY };
  } else if (isHorizontal && canMoveToPosition(newX, y)) {
    return { x: newX, y };
  } else if (!isHorizontal && canMoveToPosition(x, newY)) {
    return { x, y: newY };
  }
  return { x, y }; // blocked
}

function canMoveToPosition(x, y) {
  /** Check if a 1x1 hitbox at (x,y) can exist — wall + guard collision.
      Only checks bottom half of hitbox for Y (NES Zelda style — sprite
      top half can overlap walls regardless of direction). */
  if (!G.room.currentRoom) return false;
  const tilemap = G.room.currentRoom.tilemap;
  const reveal = G.room.revealTilemap;
  const hasLantern = reveal && G.player.playerFlags.has("has_lantern");

  const checkYStart = y + 0.5;

  const minTx = Math.floor(x + 0.001);
  const maxTx = Math.floor(x + 1.0 - 0.001);
  const minTy = Math.floor(checkYStart + 0.001);
  const maxTy = Math.floor(y + 1.0 - 0.001);

  for (let ty = minTy; ty <= maxTy; ty++) {
    for (let tx = minTx; tx <= maxTx; tx++) {
      if (tx < 0 || tx >= COLS || ty < 0 || ty >= ROWS) continue;
      const tile = hasLantern ? reveal[ty][tx] : tilemap[ty][tx];
      if (!WALKABLE.has(tile)) return false;
    }
  }

  // Guard AABB overlap
  for (const guard of G.room.guards) {
    if (x < guard.x + 1 && x + 1 > guard.x &&
        y < guard.y + 1 && y + 1 > guard.y) return false;
  }
  return true;
}

function getBlockingTile(x, y) {
  /** Same hitbox logic as canMoveToPosition, but returns the first
      non-walkable tile code instead of a boolean. */
  if (!G.room.currentRoom) return null;
  const tilemap = G.room.currentRoom.tilemap;
  const reveal = G.room.revealTilemap;
  const hasLantern = reveal && G.player.playerFlags.has("has_lantern");
  const checkYStart = y + 0.5;
  const minTx = Math.floor(x + 0.001);
  const maxTx = Math.floor(x + 1.0 - 0.001);
  const minTy = Math.floor(checkYStart + 0.001);
  const maxTy = Math.floor(y + 1.0 - 0.001);
  for (let ty = minTy; ty <= maxTy; ty++) {
    for (let tx = minTx; tx <= maxTx; tx++) {
      if (tx < 0 || tx >= COLS || ty < 0 || ty >= ROWS) continue;
      const tile = hasLantern ? reveal[ty][tx] : tilemap[ty][tx];
      if (!WALKABLE.has(tile)) return tile;
    }
  }
  return null;
}

let _lastUnlockAttempt = 0;
function checkLockedDoor(checkX, checkY, dir) {
  const now = Date.now();
  if (now - _lastUnlockAttempt < 500) return;
  if (!G.room.dungeonState) return;
  const tile = getBlockingTile(checkX, checkY);
  if (tile === "LD" || tile === "KD") {
    _lastUnlockAttempt = now;
    const dirMap = { up: "north", down: "south", left: "west", right: "east" };
    sendToServer({ type: "unlock_door", direction: dirMap[dir] });
  }
}

// State sync — always send batched inputs to server at 30fps
const SYNC_INTERVAL = 33; // ~30fps
let _lastSyncTime = 0;
function syncPlayerState() {
  if (!G.player.myPlayer) return;
  const now = performance.now();
  if (now - _lastSyncTime < SYNC_INTERVAL) return;
  _lastSyncTime = now;

  // Always send — even idle frames. Server needs continuous state for edge detection.
  const msg = {
    type: "player_input",
    inputs: G.player.pendingInputs,
    atk: G.player.state === "attacking",
    rtt: G.conn.rtt,
  };
  sendToServer(msg);
  G.player.pendingInputs = [];
}

function playerTick() {
  if (G.player.itemPickupActive) return;
  if (G.player.knockbackSlide) { G.player.isMoving = false; return; }
  if (G.player.stunUntil && performance.now() < G.player.stunUntil) { G.player.isMoving = false; return; }

  const now = performance.now();
  const dt = Math.min((now - (G.player.lastTickTime || now)) / 1000, 0.05);
  G.player.lastTickTime = now;

  const dir = getActiveDirection();

  switch (G.player.state) {
    case "idle": {
      if (!dir) { G.player.isMoving = false; G.player.lastMoveDir = null; break; }

      stopDance(G.player.myName);
      // Juice: dust puff on movement start or direction change
      if (!G.player.isMoving || G.player.lastMoveDir !== dir) {
        spawnDustPuff(G.player.myPlayer.x, G.player.myPlayer.y, dir);
      }
      G.player.lastMoveDir = dir;
      G.player.myPlayer.direction = dir;
      G.player.isMoving = true;

      // Client-side prediction: simulate move locally
      const oldX = G.player.myPlayer.x, oldY = G.player.myPlayer.y;
      const result = simulateMove(oldX, oldY, dir, dt);
      G.player.myPlayer.x = result.x;
      G.player.myPlayer.y = result.y;

      // Accumulate input for server
      const seq = G.player.inputSeq++;
      const input = { seq, dir, dt };
      G.player.inputBuffer.push({ seq, dir, dt, predX: result.x, predY: result.y });
      G.player.pendingInputs.push(input);

      // Locked door check when blocked
      if (result.x === oldX && result.y === oldY) {
        const isHorizontal = (dir === "left" || dir === "right");
        const checkX = isHorizontal ? oldX + DIR_DX[dir] * MOVE_SPEED * dt : Math.round(oldX * 2) / 2;
        const checkY = isHorizontal ? Math.round(oldY * 2) / 2 : oldY + DIR_DY[dir] * MOVE_SPEED * dt;
        checkLockedDoor(checkX, checkY, dir);
      }

      break;
    }

    case "attacking": {
      const attackDone = now - G.player.stateData.startTime >= ATTACK_FRAME_MS * ATTACK_FRAMES;
      if (attackDone) {
        // Enter cooldown gap — vulnerable, can't swing yet
        setState("attack_cooldown", { startTime: performance.now() });
      }
      break;
    }

    case "attack_cooldown": {
      const gapDone = now - G.player.stateData.startTime >= ATTACK_GAP_MS;
      if (gapDone) {
        if (G.player.keysDown["Space"] && G.player.playerFlags.has("has_sword")) {
          SfxPlayer.play("sword_slash");
          startAttack(G.player.myName, G.player.myPlayer.direction);
          spawnSlashArc(G.player.myPlayer.direction);
          setState("attacking", { startTime: performance.now() });
          _lastSyncTime = 0; // force immediate state sync
        } else if (dir) {
          stopDance(G.player.myName);
          setState("idle", {});
        } else {
          setState("idle", {});
        }
      }
      G.player.isMoving = false;
      break;
    }

    case "dying":
      G.player.isMoving = false;
      break;
  }
}

function gameLoop(timestamp) {
  requestAnimationFrame(gameLoop);

  // Hit pause — freeze updates but keep rendering the frozen frame
  const frozen = G.fx.hitPause && Date.now() < G.fx.hitPause;

  if (!frozen) {
    // Animation timer
    G.player.animTimer++;
    if (G.player.animTimer % 10 === 0) {
      G.player.animFrame = (G.player.animFrame + 1) % 2;
    }

    // Player state machine tick
    if (!G.ui.chatFocused && !G.ui.transition && !G.ui.conjuring && !G.player.spiritJarRevive) {
      playerTick();
    }
    syncPlayerState();

    // Update animations
    updateDances();
    updateAttacks();
    updateDyingMonsters();
    updateDyingOtherPlayers();
    updateProjectiles();
    updateAttackEffects();
    updateItemPickups();
    updateParticles(16.67); // ~60fps dt

    // Toggle monster hop frame every ~500ms
    G.room.monsterHopTimer++;
    if (G.room.monsterHopTimer % 30 === 0) {
      G.room.monsterHopFrame = (G.room.monsterHopFrame + 1) % 2;
    }

    // Interpolate positions — lerp for reconciliation snaps
    function easeOutQuad(t) { return t * (2 - t); }
    // Decay knockback offset for local player
    if (G.player.knockbackSlide) {
      const ks = G.player.knockbackSlide;
      const elapsed = performance.now() - ks.startTime;
      const t = Math.min(elapsed / ks.duration, 1.0);
      const remaining = 1.0 - easeOutQuad(t);
      G.player.knockbackOffsetX = ks.initialOffsetX * remaining;
      G.player.knockbackOffsetY = ks.initialOffsetY * remaining;
      if (t >= 1.0) {
        G.player.knockbackOffsetX = 0;
        G.player.knockbackOffsetY = 0;
        G.player.knockbackSlide = null;
      }
    }
    // Decay correction offset (smooth server reconciliation)
    const co = G.player.correctionOffset;
    co.x *= (1 - CORRECTION_RATE);
    co.y *= (1 - CORRECTION_RATE);
    if (Math.abs(co.x) < 0.005) co.x = 0;
    if (Math.abs(co.y) < 0.005) co.y = 0;
    // Compute display position from canonical position + knockback offset + correction
    if (G.player.myPlayer) {
      G.player.displayX = G.player.myPlayer.x + G.player.knockbackOffsetX + co.x;
      G.player.displayY = G.player.myPlayer.y + G.player.knockbackOffsetY + co.y;
    }

    for (const p of Object.values(G.room.otherPlayers)) {
      if (p.knockbackSlide) {
        const ks = p.knockbackSlide;
        const elapsed = performance.now() - ks.startTime;
        const t = Math.min(elapsed / ks.duration, 1.0);
        const progress = easeOutQuad(t);
        p.displayX = ks.fromX + (ks.toX - ks.fromX) * progress;
        p.displayY = ks.fromY + (ks.toY - ks.fromY) * progress;
        if (t >= 1.0) {
          p.displayX = ks.toX;
          p.displayY = ks.toY;
          p.knockbackSlide = null;
        }
      } else {
        // Entity interpolation — render remote players between past server snapshots
        const snaps = p.snapshots;
        if (snaps && snaps.length >= 2) {
          const renderTime = performance.now() - INTERP_DELAY;

          // Find the two snapshots bracketing renderTime
          let i = snaps.length - 1;
          while (i > 0 && snaps[i].t > renderTime) i--;

          if (i < snaps.length - 1) {
            // Interpolate between snaps[i] and snaps[i+1]
            const s0 = snaps[i], s1 = snaps[i + 1];
            const span = s1.t - s0.t;
            const t = span > 0 ? Math.min((renderTime - s0.t) / span, 1.0) : 1.0;
            p.displayX = s0.x + (s1.x - s0.x) * t;
            p.displayY = s0.y + (s1.y - s0.y) * t;
            p.moving = (s0.x !== s1.x || s0.y !== s1.y) && t < 1.0;
          } else {
            // renderTime is past all snapshots — freeze at last known position
            // (TCP/WebSocket guarantees delivery; no packet loss to extrapolate through)
            const last = snaps[snaps.length - 1];
            p.displayX = last.x;
            p.displayY = last.y;
            p.moving = false;
          }
        } else {
          // Only 0-1 snapshots (just joined) — snap directly
          p.displayX = p.x;
          p.displayY = p.y;
          p.moving = false;
        }
        p.walkState = null;
      }
    }

    // Monster freeze — when item pickup pauses monsters, shift action timers on thaw
    const mf = G.room.monsterFreeze;
    if (mf && performance.now() >= mf.start + mf.duration) {
      for (const m of G.room.monsters) {
        if (m.action && m.action.startTime < mf.start) {
          m.action.startTime += mf.duration;
        }
      }
      G.room.monsterFreeze = null;
    }

    // Unified monster action interpolation with dead reckoning
    for (const m of G.room.monsters) {
      if (m.action) {
        const a = m.action;
        // During monster freeze, clamp time to freeze start so actions pause
        const frozenNow = (mf && performance.now() < mf.start + mf.duration)
          ? mf.start : performance.now();
        const elapsed = frozenNow - a.startTime;
        const progress = a.effectiveDuration > 0
          ? Math.min(elapsed / a.effectiveDuration, 1.0) : 1.0;

        switch (a.type) {
          case "walk": {
            // Clamp: interpProgress must not lead trueProgress
            const trueProgress = Math.min(elapsed / a.duration, 1.0);
            const clampedProgress = Math.min(progress, trueProgress);
            m.displayX = a.fromX + (a.toX - a.fromX) * clampedProgress;
            m.displayY = a.fromY + (a.toY - a.fromY) * clampedProgress;
            m.walkHop = clampedProgress >= 0.5 ? 1 : 0;
            break;
          }
          case "knockback": {
            // Skip-ahead: use progress directly with easeOutQuad
            const trueProgress = Math.min(elapsed / a.duration, 1.0);
            const skipProgress = Math.min(progress, trueProgress);
            const eased = easeOutQuad(skipProgress);
            m.displayX = a.fromX + (a.toX - a.fromX) * eased;
            m.displayY = a.fromY + (a.toY - a.fromY) * eased;
            break;
          }
          // Warmups: no position interpolation (rendered in renderer.js)
          case "charge_warmup":
          case "teleport_warmup":
          case "area_warmup":
            break;
        }

        // Auto-clear completed actions (teleport_warmup waits for teleport_end)
        if (progress >= 1.0 && a.type !== "teleport_warmup") {
          if (a.type === "walk") { m.displayX = a.toX; m.displayY = a.toY; }
          if (a.type === "knockback") { m.displayX = a.toX; m.displayY = a.toY; }
          m.action = null;
          m.walkHop = undefined;
        }
      } else {
        // No action: decay correction offset toward canonical position
        const co = m.correctionOffset;
        co.x *= (1 - MONSTER_CORRECTION_RATE);
        co.y *= (1 - MONSTER_CORRECTION_RATE);
        if (Math.abs(co.x) < 0.005) co.x = 0;
        if (Math.abs(co.y) < 0.005) co.y = 0;
        m.displayX = m.x + co.x;
        m.displayY = m.y + co.y;
        m.walkHop = undefined;
      }
      // Correction offset for walk actions (smooth visual transition)
      if (m.action && m.action.type === "walk") {
        const co = m.correctionOffset;
        co.x *= (1 - MONSTER_CORRECTION_RATE);
        co.y *= (1 - MONSTER_CORRECTION_RATE);
        if (Math.abs(co.x) < 0.005) co.x = 0;
        if (Math.abs(co.y) < 0.005) co.y = 0;
        m.displayX += co.x;
        m.displayY += co.y;
      }
    }

  }

  // Render
  G.ui.ctx.clearRect(0, 0, CW, CH);

  if (renderConjuring(Date.now())) {
    // Conjuring animation is active — skip normal rendering
  } else if (G.ui.transition) {
    renderTransition(Date.now());
  } else {
    renderRoom();
    renderRevealedTiles();
    renderBrightTiles();
    renderWaterMist();
    renderWaterWalkEffect();
    renderCorpses();
    renderTombstones();
    renderAreaWarnings();
    renderHeartPickups();
    renderDungeonGroundItems();
    renderChargePreps();
    renderChargeTrails();
    renderPlayers();
    renderReviverGlow();
    renderSlashArcs();
    renderProjectiles();
    renderMonsterAttackFlashes();
    renderParticles();
    renderDarkness();
    renderFloatingTexts();
    renderNpcListening();
    renderNpcThinking();
    renderSpeechBubbles();
    renderItemPickups();
    renderUI();
    renderDamageVignette();
    renderBossDeathEffect();
    renderCollisionDebug();
    renderServerDebug();
    renderDungeonDebug();
    renderDungeonMinimap();
    if (G.player.dyingPlayerSelf) renderDeathAnimation();
    if (G.player.spiritJarRevive) renderSpiritJarRevive();
  }
  renderHeartsHUD();
  renderKeyHUD();
  renderSpiritJarHUD();
  applyScreenShake();
}
</script>
